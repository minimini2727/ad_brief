<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>광고업계 데일리 브리핑</title>
<meta name="description" content="국내 광고 매체·신규 기능·대행사·광고주·규제 뉴스를 매일 헤드라인 중심으로 정리한 브리핑">
<!--
  [데이터] 뉴스는 같은 폴더의 news.json 에 있습니다. 날짜 키("YYYY-MM-DD")를 추가하면 최신 날짜가 첫 화면에 뜹니다.
  필드 규칙은 README.md, 검증은 scripts/validate.py 를 참고하세요.
-->
<link rel="preload" href="fonts/Paperlogy-4Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Paperlogy-7Bold.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* 페이퍼로지 (fonts/ 폴더) */
@font-face{font-family:'Paperlogy';src:url('fonts/Paperlogy-4Regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Paperlogy';src:url('fonts/Paperlogy-6SemiBold.woff2') format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:'Paperlogy';src:url('fonts/Paperlogy-7Bold.woff2') format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Paperlogy';src:url('fonts/Paperlogy-8ExtraBold.woff2') format('woff2');font-weight:800;font-display:swap}
:root{
  --bg:#f5f4ef; --surface:#ffffff; --surface-2:#efede6; --ink:#17171b; --ink-2:#4b4b54; --ink-3:#8b8b94;
  --line:#e3e0d6; --accent:#1d4ed8; --accent-soft:#e6ecff; --star:#d99a00;
  --c-feature:#1d6fe0; --c-platform:#7c3aed; --c-agency:#0d9466; --c-brand:#e0571b; --c-policy:#cf2f62; --c-data:#a87a00;
  --radius:14px; --shadow:0 1px 2px rgba(20,20,30,.04),0 6px 20px rgba(20,20,30,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111115; --surface:#1a1a20; --surface-2:#24242b; --ink:#f0f0f3; --ink-2:#b8b8c2; --ink-3:#7e7e8a;
    --line:#2d2d35; --accent:#7b98ff; --accent-soft:#232b48; --star:#f2b632;
    --c-feature:#5b9bff; --c-platform:#a78bfa; --c-agency:#34c79a; --c-brand:#ff8a50; --c-policy:#ff6b98; --c-data:#e0b23a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#111115; --surface:#1a1a20; --surface-2:#24242b; --ink:#f0f0f3; --ink-2:#b8b8c2; --ink-3:#7e7e8a;
  --line:#2d2d35; --accent:#7b98ff; --accent-soft:#232b48; --star:#f2b632;
  --c-feature:#5b9bff; --c-platform:#a78bfa; --c-agency:#34c79a; --c-brand:#ff8a50; --c-policy:#ff6b98; --c-data:#e0b23a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Paperlogy',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px;line-height:1.6;letter-spacing:0;word-break:keep-all;overflow-wrap:anywhere}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* Header */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding:14px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand-mark{font-weight:800;font-size:20px;letter-spacing:-.02em}
.brand-mark b{color:var(--accent)}
.brand-sub{font-size:13px;color:var(--ink-3)}
.search{position:relative;flex:1 1 220px;max-width:300px}
.search input{width:100%;height:38px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:10px;padding:0 12px 0 34px;font:inherit;font-size:14px}
.search input::placeholder{color:var(--ink-3)}
.search svg{position:absolute;left:11px;top:11px;width:16px;height:16px;color:var(--ink-3)}
.iconbtn{height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:14px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.iconbtn:hover{border-color:var(--ink-3);color:var(--ink)}
.iconbtn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
@media (max-width:640px){
  .search{order:5;flex-basis:100%;max-width:none}
  .brand-sub{display:none}
}

/* Date bar */
.datebar{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;padding:22px 0 6px}
.navbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1;color:var(--ink-2);display:grid;place-items:center}
.navbtn:disabled{opacity:.3;cursor:default}
.navbtn:not(:disabled):hover{border-color:var(--ink-3);color:var(--ink)}
.date-label{padding:6px 14px;border-radius:12px;text-align:center}
.date-label:hover{background:var(--surface-2)}
.date-label .d{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.date-label .w{font-size:13px;color:var(--ink-3)}
.date-label .w::after{content:" ▾"}
.cal{position:absolute;top:84px;left:50%;transform:translateX(-50%);z-index:40;width:300px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:700}
.cal-head button{width:32px;height:32px;border-radius:8px;font-size:18px;color:var(--ink-2)}
.cal-head button:hover{background:var(--surface-2)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:13px}
.cal-grid .wd{color:var(--ink-3);font-size:11px;padding:4px 0}
.cal-day{aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink-3);position:relative}
.cal-day.has{color:var(--ink);font-weight:700;cursor:pointer}
.cal-day.has:hover{background:var(--surface-2)}
.cal-day.has::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--accent);margin-top:2px}
.cal-day.sel{background:var(--accent);color:#fff}
.cal-day.sel::after{background:#fff}
.cal-foot{margin-top:10px;font-size:12px;color:var(--ink-3);text-align:center}

/* Summary */
.summary{text-align:center;color:var(--ink-2);font-size:14px;margin:4px 0 18px}
.summary b{color:var(--ink)}
.tops{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:18px;box-shadow:var(--shadow)}
.tops h2{margin:0 0 8px;font-size:13px;font-weight:700;color:var(--ink-3);letter-spacing:.02em}
.tops ol{margin:0;padding:0;list-style:none;counter-reset:t}
.tops li{counter-increment:t;display:flex;gap:10px;padding:7px 0;border-top:1px dashed var(--line)}
.tops li:first-child{border-top:0}
.tops li::before{content:counter(t);flex:0 0 22px;height:22px;border-radius:6px;background:var(--ink);color:var(--bg);font-size:12px;font-weight:800;display:grid;place-items:center;margin-top:2px}
.tops a{font-weight:700;line-height:1.45}
.tops a:hover{color:var(--accent)}

/* Tabs */
.filters{position:sticky;top:0;z-index:30;background:var(--bg);padding:8px 0 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.tabs,.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.tab .n{font-size:12px;color:var(--ink-3);font-weight:600}
.tab .sw{width:8px;height:8px;border-radius:50%;background:var(--c)}
.tab.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tab.on .n{color:inherit;opacity:.7}
.tab.zero{opacity:.45}
.chips{margin-top:8px;align-items:center}
.chips .lbl{font-size:12px;color:var(--ink-3);flex:0 0 auto;margin-right:2px}
.chip{flex:0 0 auto;height:28px;padding:0 10px;border-radius:8px;font-size:13px;color:var(--ink-2);background:transparent;border:1px solid transparent}
.chip:hover{background:var(--surface-2)}
.chip.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:600}

/* List */
.group{margin:18px 0 6px}
.group-h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;margin:0 0 8px;color:var(--ink)}
.group-h::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--c)}
.group-h .n{font-weight:600;color:var(--ink-3);font-size:13px}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.list li+li{border-top:1px solid var(--line)}
.item{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;transition:background .12s}
.item:hover{background:var(--surface-2)}
.item .dot{flex:0 0 8px;height:8px;border-radius:50%;background:var(--c);margin-top:9px}
.item-body{flex:1;min-width:0}
.item-title{font-size:16px;font-weight:700;line-height:1.45}
.item.read .item-title{color:var(--ink-3);font-weight:600}
.item-meta{margin-top:4px;font-size:12.5px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.tag{display:inline-block;padding:1px 7px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);font-size:12px}
.hot{display:inline-block;font-size:11px;font-weight:800;color:var(--star);border:1px solid currentColor;border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:2px;line-height:1.5}
.datechip{font-weight:700;color:var(--ink-2)}
.chev{color:var(--ink-3);font-size:20px;line-height:1;margin-top:4px}
.empty{padding:28px 18px;text-align:center;color:var(--ink-3);background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius)}
.empty p{margin:0 0 6px}
.more-h{font-size:13px;color:var(--ink-3);margin:18px 0 8px;font-weight:700}

/* Detail */
.detail{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 22px 18px;margin:22px 0}
@media (max-width:640px){.detail{padding:18px 16px 14px;margin:14px 0}}
.detail-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:16px}
.back{font-size:14px;color:var(--ink-2);display:inline-flex;align-items:center;gap:4px;padding:6px 8px;margin-left:-8px;border-radius:8px}
.back:hover{background:var(--surface-2);color:var(--ink)}
.scrapbtn{font-size:14px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);color:var(--ink-2)}
.scrapbtn.on{color:var(--star);border-color:var(--star)}
.kicker{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--ink-3)}
.catpill{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);padding:3px 10px;border-radius:999px;font-size:12.5px}
.detail h1{font-size:26px;line-height:1.35;letter-spacing:-.025em;margin:12px 0 10px;font-weight:800}
@media (max-width:640px){.detail h1{font-size:22px}}
.lede{font-size:17px;color:var(--ink-2);margin:0 0 18px;line-height:1.65}
.detail h2{font-size:14px;font-weight:800;margin:20px 0 8px;display:flex;align-items:baseline;gap:8px}
.detail h2 small{font-weight:500;color:var(--ink-3);font-size:12px}
.points{margin:0;padding:0;list-style:none}
.points li{position:relative;padding:6px 0 6px 18px;border-top:1px solid var(--line)}
.points li:first-child{border-top:0}
.points li::before{content:"";position:absolute;left:2px;top:15px;width:6px;height:6px;border-radius:50%;background:var(--c)}
.action{margin-top:18px;background:var(--surface-2);border-radius:12px;padding:4px 16px 10px}
.action ul{margin:0;padding:0 0 0 18px}
.action li{padding:3px 0}
.source{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:20px;padding:14px 16px;border:1px solid var(--line);border-radius:12px}
.source:hover{border-color:var(--accent)}
.source .s1{font-size:12px;color:var(--ink-3)}
.source .s2{font-weight:700}
.source .go{color:var(--accent);font-weight:700;font-size:14px;white-space:nowrap}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.pager a{display:block;padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:14px;line-height:1.4;min-height:62px}
.pager a:hover{outline:1px solid var(--line)}
.pager .pl{font-size:12px;color:var(--ink-3);display:block;margin-bottom:2px}
.pager .next{text-align:right}
.pager span.ph{visibility:hidden}

/* Archive */
.pagehead{margin:24px 0 12px}
.pagehead h1{font-size:24px;margin:0 0 4px;letter-spacing:-.02em}
.pagehead p{margin:0;color:var(--ink-3);font-size:14px}
.arch{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.arch li+li{border-top:1px solid var(--line)}
.arch a{display:grid;grid-template-columns:76px 1fr auto;gap:14px;align-items:center;padding:14px 16px}
.arch a:hover{background:var(--surface-2)}
.arch .ad{font-weight:800;font-size:18px;line-height:1.1}
.arch .ad small{display:block;font-size:12px;font-weight:500;color:var(--ink-3);margin-top:3px}
.arch .at{font-weight:600;font-size:15px;line-height:1.45}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:8px;background:var(--surface-2)}
.bar i{display:block;background:var(--c)}
.arch .ac{font-size:13px;color:var(--ink-3);white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-3);margin:10px 0 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend span::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}

footer{margin:40px 0 32px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3);line-height:1.7}
footer p{margin:2px 0}
</style>
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <a class="brand" href="#/"><span class="brand-mark">AD<b>BRIEF</b></span><span class="brand-sub">광고업계 데일리 브리핑</span></a>
    <label class="search" aria-label="뉴스 검색">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="전체 기간 검색 (예: ADVoost, 카카오)" autocomplete="off">
    </label>
    <a class="iconbtn" id="navArchive" href="#/archive">📅 지난 브리핑</a>
    <a class="iconbtn" id="navScrap" href="#/scrap">★ 스크랩</a>
    <button class="iconbtn" id="themeBtn" type="button" aria-label="화면 테마 전환">◐</button>
  </div>
</header>

<main class="wrap">
  <section id="dayChrome" hidden>
    <div class="datebar">
      <button class="navbtn" id="prevDay" type="button" aria-label="이전 브리핑">‹</button>
      <button class="date-label" id="dateLabel" type="button" aria-haspopup="dialog"><span class="d" id="dateD"></span><span class="w" id="dateW"></span></button>
      <button class="navbtn" id="nextDay" type="button" aria-label="다음 브리핑">›</button>
      <div class="cal" id="cal" hidden role="dialog" aria-label="날짜 선택"></div>
    </div>
    <p class="summary" id="summary"></p>
    <div id="tops"></div>
    <div class="filters">
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="chips" id="chips"></div>
    </div>
  </section>
  <div id="app"></div>
  <footer>
    <p>요약은 각 출처 기사·공식 공지를 바탕으로 재구성한 것이며, ‘실무 체크’는 편집 메모입니다.</p>
    <p>수치·시행일은 반드시 원문과 매체 공식 공지에서 최종 확인하세요. <span id="updated"></span></p>
  </footer>
</main>


<script>
(function(){
  "use strict";
  var appEl = document.getElementById('app');
  appEl.innerHTML = '<div class="empty"><p>브리핑을 불러오는 중…</p></div>';
  fetch('news.json?v=' + Date.now(), {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(start)
    .catch(function(e){
      appEl.innerHTML = '<div class="empty"><p>뉴스 데이터를 불러오지 못했습니다.</p><p>잠시 후 새로고침해 주세요. ('+String(e.message||e)+')</p></div>';
    });
})();

function start(RAW){
  "use strict";
  var CATS = [
    {key:'feature',  label:'매체 신규기능',   color:'var(--c-feature)'},
    {key:'platform', label:'매체·플랫폼 동향', color:'var(--c-platform)'},
    {key:'agency',   label:'대행사',         color:'var(--c-agency)'},
    {key:'brand',    label:'광고주·캠페인',   color:'var(--c-brand)'},
    {key:'policy',   label:'규제·정책',      color:'var(--c-policy)'},
    {key:'data',     label:'시장·데이터',     color:'var(--c-data)'}
  ];
  var CAT = {}; CATS.forEach(function(c){ CAT[c.key]=c; });
  var MEDIA = [
    ['naver','네이버'],['kakao','카카오'],['meta','메타'],['google','구글·유튜브'],
    ['commerce','커머스'],['tiktok','틱톡'],['etc','기타']
  ];
  var MEDIA_LABEL = {}; MEDIA.forEach(function(m){ MEDIA_LABEL[m[0]]=m[1]; });
  var WD = ['일','월','화','수','목','금','토'];

  var DATES = Object.keys(RAW.days).sort().reverse();
  var ALL = [], BY_ID = {};
  DATES.forEach(function(d){
    RAW.days[d].items.forEach(function(it){ it.date = d; ALL.push(it); BY_ID[it.id] = it; });
  });

  var state = { cat:'all', media:'all', calMonth:null };
  var scrollMemo = {};

  /* storage (optional, never required) */
  function load(k, def){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }catch(e){ return def; } }
  function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  var READ = load('adbrief.read', {});
  var SCRAP = load('adbrief.scrap', {});

  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function parseD(d){ var p=d.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  function fmtLong(d){ var p=d.split('-'); return p[0]+'. '+(+p[1])+'. '+(+p[2]); }
  function fmtShort(d){ var p=d.split('-'); return (+p[1])+'.'+(+p[2]); }
  function wd(d){ return WD[parseD(d).getDay()]+'요일'; }
  function catStyle(k){ return '--c:'+(CAT[k]?CAT[k].color:'var(--ink-3)'); }

  function filtered(items){
    return items.filter(function(it){
      return (state.cat==='all' || it.cat===state.cat) && (state.media==='all' || it.media.indexOf(state.media)>-1);
    });
  }
  function ordered(items){
    var order = {}; CATS.forEach(function(c,i){ order[c.key]=i; });
    return items.slice().sort(function(a,b){
      if(order[a.cat]!==order[b.cat]) return order[a.cat]-order[b.cat];
      return (b.hot?1:0)-(a.hot?1:0);
    });
  }

  function itemRow(it, showDate){
    var tags = it.media.map(function(m){ return '<span class="tag">'+esc(MEDIA_LABEL[m]||m)+'</span>'; }).join('');
    return '<li><a class="item'+(READ[it.id]?' read':'')+'" href="#/d/'+it.date+'/a/'+it.id+'" style="'+catStyle(it.cat)+'">'+
      '<span class="dot"></span><div class="item-body"><div class="item-title">'+esc(it.title)+(it.hot?'<span class="hot">주요</span>':'')+(SCRAP[it.id]?' <span style="color:var(--star)">★</span>':'')+'</div>'+
      '<div class="item-meta">'+(showDate?'<span class="datechip">'+fmtShort(it.date)+'</span>':'')+
      (showDate||state.cat!=='all'?'<span>'+esc(CAT[it.cat].label)+'</span>':'')+tags+'<span>'+esc(it.source.name)+'</span></div></div>'+
      '<span class="chev" aria-hidden="true">›</span></a></li>';
  }

  var $ = function(id){ return document.getElementById(id); };
  var app = $('app'), chrome = $('dayChrome');

  /* ---------- Day view ---------- */
  var currentDay = DATES[0];
  function renderDay(d){
    currentDay = d;
    chrome.hidden = false;
    var day = RAW.days[d], items = day.items;
    var idx = DATES.indexOf(d);
    $('dateD').textContent = fmtLong(d);
    $('dateW').textContent = wd(d) + (idx===0 ? ' · 최신' : '');
    $('prevDay').disabled = idx >= DATES.length-1;
    $('nextDay').disabled = idx <= 0;
    var hotN = items.filter(function(i){return i.hot;}).length;
    var todayKST = new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
    var note = (idx===0 && d<todayKST) ? '<br><span style="font-size:12.5px;color:var(--ink-3)">오늘('+fmtShort(todayKST)+') 브리핑은 매일 오전 9시 전후로 올라옵니다. 지금은 가장 최근 브리핑을 보여드립니다.</span>' : '';
    $('summary').innerHTML = '<b>'+items.length+'건</b>의 소식 · 주요 <b>'+hotN+'건</b>'+note;

    var hot = items.filter(function(i){return i.hot;}).slice(0,4);
    $('tops').innerHTML = hot.length ? '<section class="tops"><h2>오늘 꼭 볼 헤드라인</h2><ol>'+hot.map(function(it){
      return '<li><a href="#/d/'+d+'/a/'+it.id+'">'+esc(it.title)+'</a></li>'; }).join('')+'</ol></section>' : '';

    // tabs
    var counts = {}; items.forEach(function(i){ counts[i.cat]=(counts[i.cat]||0)+1; });
    var t = '<button class="tab'+(state.cat==='all'?' on':'')+'" data-cat="all" role="tab">전체 <span class="n">'+items.length+'</span></button>';
    CATS.forEach(function(c){
      var n = counts[c.key]||0;
      t += '<button class="tab'+(state.cat===c.key?' on':'')+(n?'':' zero')+'" data-cat="'+c.key+'" role="tab" style="--c:'+c.color+'"><span class="sw"></span>'+c.label+' <span class="n">'+n+'</span></button>';
    });
    $('tabs').innerHTML = t;
    var ch = '<span class="lbl">매체</span><button class="chip'+(state.media==='all'?' on':'')+'" data-media="all">전체</button>';
    MEDIA.forEach(function(m){ ch += '<button class="chip'+(state.media===m[0]?' on':'')+'" data-media="'+m[0]+'">'+m[1]+'</button>'; });
    $('chips').innerHTML = ch;

    var list = filtered(items), html = '';
    if(!list.length){
      var label = state.cat==='all' ? '' : '‘'+CAT[state.cat].label+'’ ';
      var mlabel = state.media==='all' ? '' : '‘'+MEDIA_LABEL[state.media]+'’ ';
      html = '<div class="empty"><p>이 날짜에는 '+mlabel+label+'뉴스가 없습니다.</p></div>';
      var others = filtered(ALL).filter(function(i){ return i.date!==d; }).slice(0,6);
      if(others.length){
        html += '<div class="more-h">다른 날짜의 '+mlabel+label+'소식</div><ul class="list">'+others.map(function(i){return itemRow(i,true);}).join('')+'</ul>';
      }
    } else if(state.cat==='all'){
      CATS.forEach(function(c){
        var g = list.filter(function(i){return i.cat===c.key;});
        if(!g.length) return;
        g.sort(function(a,b){ return (b.hot?1:0)-(a.hot?1:0); });
        html += '<section class="group"><h3 class="group-h" style="--c:'+c.color+'">'+c.label+' <span class="n">'+g.length+'</span></h3><ul class="list">'+g.map(function(i){return itemRow(i,false);}).join('')+'</ul></section>';
      });
    } else {
      html = '<section class="group"><ul class="list">'+ordered(list).map(function(i){return itemRow(i,false);}).join('')+'</ul></section>';
    }
    app.innerHTML = html;
  }

  /* ---------- Article view ---------- */
  function renderArticle(d, id){
    chrome.hidden = true;
    var it = BY_ID[id];
    if(!it){ location.hash = '#/d/'+d; return; }
    READ[id] = 1; save('adbrief.read', READ);
    var seq = ordered(filtered(RAW.days[it.date].items));
    if(seq.indexOf(it)<0) seq = ordered(RAW.days[it.date].items);
    var i = seq.indexOf(it), prev = seq[i-1], next = seq[i+1];
    var tags = it.media.map(function(m){ return '<span class="tag">'+esc(MEDIA_LABEL[m]||m)+'</span>'; }).join('');
    var src = it.source || {};
    app.innerHTML =
      '<article class="detail" style="'+catStyle(it.cat)+'">'+
        '<div class="detail-top"><a class="back" href="#/d/'+it.date+'">← '+fmtShort(it.date)+' 브리핑 목록</a>'+
        '<button class="scrapbtn'+(SCRAP[id]?' on':'')+'" id="scrapBtn" type="button">'+(SCRAP[id]?'★ 스크랩됨':'☆ 스크랩')+'</button></div>'+
        '<div class="kicker"><span class="catpill">'+esc(CAT[it.cat].label)+'</span><span>'+fmtLong(it.date)+' 브리핑</span>'+tags+(it.hot?'<span class="hot" style="margin-left:0">주요</span>':'')+'</div>'+
        '<h1>'+esc(it.title)+'</h1>'+
        '<p class="lede">'+esc(it.lede)+'</p>'+
        '<h2>핵심 내용</h2><ul class="points">'+it.points.map(function(p){return '<li>'+esc(p)+'</li>';}).join('')+'</ul>'+
        (it.action && it.action.length ? '<div class="action"><h2>실무 체크 <small>편집 메모 · 원문 내용 아님</small></h2><ul>'+it.action.map(function(p){return '<li>'+esc(p)+'</li>';}).join('')+'</ul></div>' : '')+
        '<a class="source" href="'+esc(src.url||'#')+'" target="_blank" rel="noopener noreferrer"><span><span class="s1">출처'+(src.date?' · '+fmtLong(src.date):'')+'</span><br><span class="s2">'+esc(src.name||'')+'</span></span><span class="go">원문 보기 ↗</span></a>'+
        '<nav class="pager">'+
          (prev ? '<a href="#/d/'+prev.date+'/a/'+prev.id+'"><span class="pl">← 이전 기사</span>'+esc(prev.title)+'</a>' : '<span class="ph"></span>')+
          (next ? '<a class="next" href="#/d/'+next.date+'/a/'+next.id+'"><span class="pl">다음 기사 →</span>'+esc(next.title)+'</a>' : '<span class="ph"></span>')+
        '</nav>'+
      '</article>';
    $('scrapBtn').addEventListener('click', function(){
      if(SCRAP[id]) delete SCRAP[id]; else SCRAP[id] = 1;
      save('adbrief.scrap', SCRAP);
      this.classList.toggle('on', !!SCRAP[id]);
      this.textContent = SCRAP[id] ? '★ 스크랩됨' : '☆ 스크랩';
    });
  }

  /* ---------- Archive ---------- */
  function renderArchive(){
    chrome.hidden = true;
    var legend = '<div class="legend">'+CATS.map(function(c){return '<span style="--c:'+c.color+'">'+c.label+'</span>';}).join('')+'</div>';
    var rows = DATES.map(function(d){
      var items = RAW.days[d].items, n = items.length;
      var top = items.filter(function(i){return i.hot;})[0] || items[0];
      var bar = CATS.map(function(c){
        var k = items.filter(function(i){return i.cat===c.key;}).length;
        return k ? '<i style="--c:'+c.color+';width:'+(k/n*100)+'%" title="'+c.label+' '+k+'건"></i>' : '';
      }).join('');
      var p = d.split('-');
      return '<li><a href="#/d/'+d+'"><span class="ad">'+(+p[1])+'.'+(+p[2])+'<small>'+p[0]+' · '+WD[parseD(d).getDay()]+'</small></span>'+
        '<span><span class="at">'+esc(top.title)+'</span><span class="bar">'+bar+'</span></span><span class="ac">'+n+'건 ›</span></a></li>';
    }).join('');
    app.innerHTML = '<div class="pagehead"><h1>지난 브리핑</h1><p>날짜를 누르면 그날의 헤드라인을 다시 볼 수 있습니다. 총 '+DATES.length+'일 · '+ALL.length+'건</p>'+legend+'</div><ul class="arch">'+rows+'</ul>';
  }

  /* ---------- Search ---------- */
  function renderSearch(q){
    chrome.hidden = true;
    var qq = q.trim().toLowerCase();
    var res = !qq ? [] : ALL.filter(function(it){
      var hay = [it.title, it.lede, it.points.join(' '), (it.action||[]).join(' '), it.source.name, CAT[it.cat].label, it.media.map(function(m){return MEDIA_LABEL[m];}).join(' ')].join(' ').toLowerCase();
      return qq.split(/\s+/).every(function(w){ return hay.indexOf(w)>-1; });
    });
    app.innerHTML = '<div class="pagehead"><h1>‘'+esc(q)+'’ 검색 결과</h1><p>전체 기간에서 '+res.length+'건을 찾았습니다.</p></div>'+
      (res.length ? '<ul class="list">'+res.map(function(i){return itemRow(i,true);}).join('')+'</ul>' : '<div class="empty"><p>일치하는 소식이 없습니다.</p><p>매체명(예: 네이버), 상품명(예: ADVoost), 키워드(예: 규제)로 검색해 보세요.</p></div>');
  }

  /* ---------- Scrap ---------- */
  function renderScrap(){
    chrome.hidden = true;
    var res = ALL.filter(function(i){ return SCRAP[i.id]; });
    app.innerHTML = '<div class="pagehead"><h1>스크랩</h1><p>기사 상세에서 ☆를 누르면 여기에 모입니다. 이 브라우저에만 저장됩니다.</p></div>'+
      (res.length ? '<ul class="list">'+res.map(function(i){return itemRow(i,true);}).join('')+'</ul>' : '<div class="empty"><p>아직 스크랩한 기사가 없습니다.</p></div>');
  }

  /* ---------- Calendar ---------- */
  function renderCal(){
    var cal = $('cal'), base = state.calMonth || parseD(currentDay);
    var y = base.getFullYear(), m = base.getMonth();
    var first = new Date(y, m, 1).getDay(), last = new Date(y, m+1, 0).getDate();
    var set = {}; DATES.forEach(function(d){ set[d]=RAW.days[d].items.length; });
    var h = '<div class="cal-head"><button type="button" data-cm="-1" aria-label="이전 달">‹</button><span>'+y+'년 '+(m+1)+'월</span><button type="button" data-cm="1" aria-label="다음 달">›</button></div><div class="cal-grid">';
    WD.forEach(function(w){ h += '<span class="wd">'+w+'</span>'; });
    for(var i=0;i<first;i++) h += '<span></span>';
    for(var dd=1; dd<=last; dd++){
      var key = y+'-'+String(m+1).padStart(2,'0')+'-'+String(dd).padStart(2,'0');
      if(set[key]) h += '<button type="button" class="cal-day has'+(key===currentDay?' sel':'')+'" data-go="'+key+'" title="'+set[key]+'건">'+dd+'</button>';
      else h += '<span class="cal-day">'+dd+'</span>';
    }
    h += '</div><div class="cal-foot">점이 있는 날짜에 브리핑이 있습니다 · <a href="#/archive" style="color:var(--accent)">전체 목록</a></div>';
    cal.innerHTML = h;
  }
  function toggleCal(open){
    var cal = $('cal');
    var willOpen = open===undefined ? cal.hidden : open;
    if(willOpen){ state.calMonth = parseD(currentDay); renderCal(); }
    cal.hidden = !willOpen;
  }

  /* ---------- Router ---------- */
  var lastHash = null;
  function route(){
    if(lastHash!==null) scrollMemo[lastHash] = window.scrollY;
    var h = decodeURIComponent(location.hash.replace(/^#/, '')) || '/';
    var parts = h.split('/').filter(Boolean);
    toggleCal(false);
    $('navArchive').classList.toggle('on', parts[0]==='archive');
    $('navScrap').classList.toggle('on', parts[0]==='scrap');
    if(parts[0]==='d' && RAW.days[parts[1]]){
      if(parts[2]==='a') renderArticle(parts[1], parts[3]); else renderDay(parts[1]);
    } else if(parts[0]==='archive'){ renderArchive(); }
    else if(parts[0]==='scrap'){ renderScrap(); }
    else if(parts[0]==='search'){ var q = parts.slice(1).join('/'); $('q').value = q; renderSearch(q); }
    else { renderDay(DATES[0]); }
    if(parts[0]!=='search' && document.activeElement!==$('q')) $('q').value = '';
    var key = location.hash || '#/';
    window.scrollTo(0, (parts[2]==='a') ? 0 : (scrollMemo[key]||0));
    lastHash = key;
  }

  /* ---------- Events ---------- */
  $('tabs').addEventListener('click', function(e){
    var b = e.target.closest('[data-cat]'); if(!b) return;
    state.cat = b.getAttribute('data-cat'); renderDay(currentDay);
    b = $('tabs').querySelector('.on'); if(b && b.scrollIntoView) b.scrollIntoView({inline:'nearest', block:'nearest'});
  });
  $('chips').addEventListener('click', function(e){
    var b = e.target.closest('[data-media]'); if(!b) return;
    state.media = b.getAttribute('data-media'); renderDay(currentDay);
  });
  $('prevDay').addEventListener('click', function(){ var i = DATES.indexOf(currentDay); if(i < DATES.length-1) location.hash = '#/d/'+DATES[i+1]; });
  $('nextDay').addEventListener('click', function(){ var i = DATES.indexOf(currentDay); if(i > 0) location.hash = '#/d/'+DATES[i-1]; });
  $('dateLabel').addEventListener('click', function(e){ e.stopPropagation(); toggleCal(); });
  $('cal').addEventListener('click', function(e){
    e.stopPropagation();
    var cm = e.target.closest('[data-cm]');
    if(cm){ var b = state.calMonth; state.calMonth = new Date(b.getFullYear(), b.getMonth()+(+cm.getAttribute('data-cm')), 1); renderCal(); return; }
    var go = e.target.closest('[data-go]');
    if(go){ location.hash = '#/d/'+go.getAttribute('data-go'); }
  });
  document.addEventListener('click', function(){ if(!$('cal').hidden) toggleCal(false); });
  var qt;
  $('q').addEventListener('input', function(){
    var v = this.value; clearTimeout(qt);
    qt = setTimeout(function(){
      if(v.trim()) location.hash = '#/search/'+encodeURIComponent(v.trim());
      else location.hash = '#/d/'+currentDay;
    }, 250);
  });
  document.addEventListener('keydown', function(e){
    if(e.target.tagName==='INPUT') return;
    var h = location.hash;
    if(e.key==='Escape'){
      if(!$('cal').hidden) return toggleCal(false);
      var m = h.match(/#\/d\/([\d-]+)\/a\//); if(m) location.hash = '#/d/'+m[1];
    }
    if(!chrome.hidden){
      if(e.key==='ArrowLeft') $('prevDay').click();
      if(e.key==='ArrowRight') $('nextDay').click();
    }
  });

  /* theme */
  var themes = ['auto','light','dark'], tIdx = Math.max(0, themes.indexOf(load('adbrief.theme','auto')));
  function applyTheme(){
    var t = themes[tIdx];
    if(t==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
    $('themeBtn').textContent = t==='auto' ? '◐ 자동' : (t==='light' ? '☀ 라이트' : '☾ 다크');
  }
  $('themeBtn').addEventListener('click', function(){ tIdx = (tIdx+1)%3; save('adbrief.theme', themes[tIdx]); applyTheme(); });
  applyTheme();

  if(RAW.updated){
    var u = new Date(RAW.updated);
    if(!isNaN(u)) $('updated').textContent = '마지막 업데이트: '+u.getFullYear()+'.'+(u.getMonth()+1)+'.'+u.getDate()+' '+String(u.getHours()).padStart(2,'0')+':'+String(u.getMinutes()).padStart(2,'0');
  }
  window.addEventListener('hashchange', route);
  route();
}
</script>
</body>
</html>
